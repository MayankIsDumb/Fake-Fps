plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

base { archivesName = 'fakefps-1.21.11' }

loom {
    splitEnvironmentSourceSets()
    mods { fakefps { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
    implementation project(':common')
    include project(':common')

    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.5+1.21.11"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", "0.19.3"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": "0.19.3"
    }
}

jar {
    from project(':common').sourceSets.main.output
}
