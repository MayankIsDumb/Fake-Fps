plugins { id 'fabric-loom' version '1.18.0-alpha.9' }
base { archivesName = 'fakefps-26.1.2' }

loom {
    splitEnvironmentSourceSets()
    mods { fakefps { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

sourceSets {
    main.java.srcDirs = ['../v26_1/src/main/java']
    client.java.srcDirs = ['../v26_1/src/client/java']
    main.resources.srcDirs = ['src/main/resources']
}

dependencies {
    implementation project(':common')
    include project(':common')
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", "0.19.3"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": "0.19.3"
    }
}

jar {
    from project(':common').sourceSets.main.output
}
