plugins { id 'fabric-loom' version '1.18.0-alpha.9' }
base { archivesName = 'fakefps-26.3' }

loom {
    splitEnvironmentSourceSets()
    mods { fakefps { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    // Dev-launch diagnostics: pure interpreter mode to rule out ALL JIT
    // compilers in the resource-reload segfault. Very slow boot.
    // Affects `runClient` only.
    runs {
        client {
            vmArg "-Xint"
        }
    }
}

sourceSets {
    main.java.srcDirs = ['src/main/java', '../v26_1/src/main/java']
    client.java.srcDirs = ['src/client/java']
    main.resources.srcDirs = ['src/main/resources']
}

dependencies {
    implementation project(':common')
    include project(':common')
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.160.5+26.3"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", "0.19.5"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": "0.19.5"
    }
}

jar {
    from project(':common').sourceSets.main.output
}

// Dev-launch: run the GAME on a selected JDK 25 (Gradle/Loom itself must stay
// on the pinned JDK 25 per ~/.gradle/gradle.properties). The game JVM is
// resolved via -Dorg.gradle.java.installations.paths=<jdk dir> on the
// runClient command line. Affects `runClient` only, not the built jar.
tasks.named('runClient', JavaExec) {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
}
